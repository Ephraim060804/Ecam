{% extends "base.html" %}
{% block titre %}Connexion · ECAM{% endblock %}
{% block ecam %}
<form class="carte carte-etroite" method="post">
    <h1>Connexion</h1>
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Téléphone<input class="champ" name="telephone" type="tel" required autocomplete="username"></label>
    <label>Mot de passe<input class="champ" name="mot_de_passe" type="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Se connecter</button>
    <p class="aide">Pas encore de compte ? <a href="{{ url_for('portail') }}">Inscrivez-vous</a></p>
</form>
{% endblock %}
