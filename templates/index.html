<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECAM - Splash Screen</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            background-image: url("{{ url_for('static', filename='images/université.jpg') }}");
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Conteneur principal avec effet glassmorphism réduit */
        .Glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2.5rem;
            gap: 1.8rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15),
                        0 0 0 1px rgba(255, 255, 255, 0.05),
                        inset 0 0 20px rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            max-width: 450px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Style pour le conteneur d'image */
        .Glass .image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .Glass .image img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        /* Style pour le texte */
        .Glass .text h2 {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            line-height: 1.4;
        }

        /* Animation de chargement subtile */
        .loading-dots {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Timer circulaire */
        .timer-ring {
            position: relative;
            width: 50px;
            height: 50px;
            margin-top: 0.5rem;
        }

        .timer-ring svg {
            transform: rotate(-90deg);
            width: 50px;
            height: 50px;
        }

        .timer-ring .bg-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 3;
        }

        .timer-ring .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.8);
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .Glass {
                padding: 2.5rem 2rem;
                gap: 1.5rem;
            }
            
            .Glass .image {
                width: 100px;
                height: 100px;
            }
            
            .Glass .text h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="Glass" id="splash-screen">
        <div class="image">
            
            <img src="{{ url_for('static', filename='images/Ecam.png') }}" alt="Logo ECAM">
        </div>
        <div class="text">
            <h2>Ecole Canadienne<br>de Management</h2>
        </div>

        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Timer -->
        <div class="timer-ring">
            <svg viewBox="0 0 50 50">
                <circle class="bg-circle" cx="25" cy="25" r="22"/>
                <circle class="progress-circle" id="progress-circle" cx="25" cy="25" r="22"
                        stroke-dasharray="138.23" stroke-dashoffset="0"/>
            </svg>
            <div class="timer-text" id="timer-text">10</div>
        </div>
    </div>

    <script>
        // ⏱️ Splash Screen de 10 secondes
        const SPLASH_DURATION = 10;
        const progressCircle = document.getElementById('progress-circle');
        const timerText = document.getElementById('timer-text');
        const circumference = 2 * Math.PI * 22;

        let timeLeft = SPLASH_DURATION;

        function updateTimer() {
            timeLeft--;
            timerText.textContent = timeLeft;
            
            const progress = timeLeft / SPLASH_DURATION;
            const offset = circumference * (1 - progress);
            progressCircle.style.strokeDashoffset = offset;
            
            if (timeLeft <= 0) {
                document.getElementById('splash-screen').style.opacity = '0';
                document.getElementById('splash-screen').style.transform = 'scale(0.9)';
                document.getElementById('splash-screen').style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                
                setTimeout(() => {
                    window.location.href = "{{ url_for('accueil') }}";
                }, 500);
            }
        }

        const timerInterval = setInterval(updateTimer, 1000);

        // Clic pour passer plus vite
        document.getElementById('splash-screen').addEventListener('click', function() {
            clearInterval(timerInterval);
            this.style.opacity = '0';
            this.style.transform = 'scale(0.9)';
            this.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            setTimeout(() => {
                window.location.href = "{{ url_for('accueil') }}";
            }, 500);
        });

        // Initialiser le cercle
        progressCircle.style.strokeDashoffset = 0;
    </script>
</body>
</html>
